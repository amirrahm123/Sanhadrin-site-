<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Accessibility settings (src/components/AccessibilityWidget.tsx) are
         stored in localStorage and expressed as classes on <html>. Applying
         them HERE — before the app hydrates — is what stops saved settings
         from flashing unstyled on reload. Keep the storage key and the class
         names in sync with the widget. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('sandrine-a11y')) || {}
          var c = document.documentElement.classList
          // Allow-list the font class: never write an arbitrary string from
          // storage onto <html>.
          if (/^a11y-font-(75|90|110|125|150)$/.test(s.fontSize)) c.add(s.fontSize)
          var modes = {
            contrast: 'a11y-contrast-high',
            invert: 'a11y-invert',
            grayscale: 'a11y-grayscale',
            links: 'a11y-links',
            readable: 'a11y-readable',
            noMotion: 'a11y-no-motion',
            cursor: 'a11y-cursor',
          }
          for (var k in modes) if (s[k]) c.add(modes[k])
        } catch (e) {
          /* no storage / bad JSON → plain site */
        }
      })()
    </script>

    <!-- Google Search Console verification (meta-tag method).
         TODO(launch): replace the token; must match SITE.searchConsoleToken.
         Alternative: verify via DNS TXT record instead (see README). -->
    <meta name="google-site-verification" content="REPLACE_WITH_SEARCH_CONSOLE_TOKEN" />

    <!-- Google Tag Manager. TODO(launch): replace GTM-XXXXXXX (must match
         SITE.gtmId). GA4 is configured *inside* GTM (see README). dataLayer is
         initialised here so events fire even before the real container is live. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-XXXXXXX');
    </script>
    <!-- End Google Tag Manager -->

    <!-- Optional: direct GA4 (only if NOT routing GA4 through GTM). Leave
         commented out unless you deliberately want a second, direct tag.
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->

    <!-- Per-page <title>/description/canonical/OG are injected by <Seo/>
         (src/components/Seo.tsx) so each route emits exactly one title. -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500;600;700;900&family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Google Tag Manager (noscript). TODO(launch): replace GTM-XXXXXXX. -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
